<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header dengan Banner dan PP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER: pembungkus banner + PP -->
  <header class="header">

    <!-- BANNER: gambar yang melebar penuh -->
    <img
      src="https://cdn.phototourl.com/free/2026-09-22-eb6c481f-261a-4bda-819a-7fbd7242f401.png"
      alt="Banner"
      class="banner"
    >

    <!-- WRAPPER PP: pembungkus foto profil + teks, posisinya menempel di atas banner -->
    <div class="pp-wrapper">

      <!-- FOTO PROFIL -->
      <img
        src="https://picsum.photos/200"
        alt="Foto Profil"
        class="pp"
      >

      <!-- TEKS DI BAWAH PP -->
      <p class="new-text">New Text</p>

    </div>

  </header>
    <!-- PARAGRAF LOREM IPSUM DI BAWAH HEADER -->
  <section class="deskripsi">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    </p>
  </section>
</body>
</html>
