<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header dengan Banner dan PP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!--Header awal-->
  <header class="header">
    <div class="banner-wrapper">
    <img
      src="https://cdn.phototourl.com/member/2026-09-26-f6a7bb28-1a92-4208-8d58-c47eac867726.png" 
      alt="Banner"
      class="banner"
    >
    <div class="banner-overlay"></div>
    </div>
    
    <!--PP awal-->
    <div class="pp-wrapper">
      <img
        src="https://cdn.phototourl.com/free/2026-09-22-a6001fdc-4ebc-4671-8a73-9846d56757b6.jpg"
        alt="Foto Profil"
        class="pp">
      <p class="new-text">Perkenalkan saya -</p>
      <p1 class="new-text1">Muhammad Almer Nur Zhafar</p1>
    </div>
    <!--PP akhir-->

    <!--Trapesium menu awal-->
  <div class="trapesium">
    <div class="trapesium-isi">
        <span class="menu-item">Home</span>
        <span class="menu-item">Intro</span>
        <span class="menu-item">My work</span>
        <span class="menu-item">Skill</span>
        <span class="menu-item">Contact</span>
    </div>
  </div>

  <div class="menu-dropdown">
    <button class="menu-toggle">☰</button>
    <div class="dropdown-isi">
      <a href="#" class="dropdown-item">Home</a>
      <a href="#" class="dropdown-item">Intro</a>
      <a href="#" class="dropdown-item">My work</a>
      <a href="#" class="dropdown-item">Skill</a>
      <a href="#" class="dropdown-item">Contact</a>
    </div>
  </div>
  <!--Trapesium menu akhir-->

  </header>
    <!--Header akhir-->


    <!--Deskripsi awal-->
  </div>
  <section class="deskripsi">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    </p>
  </section>
  <!--Deskripsi akhir-->
</body>
</html>
